name: Validate research package

on:
  push:
  pull_request:

jobs:
  package-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate package boundary and dataset manifest
        run: python3 scripts/check_package.py
      - name: Syntax-check the study code (data and pm4py are not needed in CI)
        run: python3 -m compileall -q realdata/src
